schema_version = 1

# rote itself, because the scores come from `rote play score` rather than from
# any reimplementation of the rubric. If you can run a play you already have it;
# it is declared so the dependency is visible rather than assumed.
[[tools]]
id = "rote"
command = "rote"
required = true

[[tools.install]]
manager = "sh"
command = ["sh", "-c", "curl -fsSL https://getrote.dev/install | bash"]

[[tools]]
id = "python3"
command = "python3"
required = true
version_requirement = ">=3.6"

[[tools.install]]
manager = "apt"
package = "python3"

[[tools.install]]
manager = "dnf"
package = "python3"

[[tools.install]]
manager = "pacman"
package = "python"
